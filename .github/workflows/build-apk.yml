name: Build Tap Rush V7 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V7 project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'TapRushV7_Android_CloudBuild_Project.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "V7 ZIP file was not found."
            exit 1
          fi

          mkdir -p build-project
          unzip -q "$ZIP_FILE" -d build-project

          SETTINGS_FILE="$(find build-project -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-rush-v7-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
